# Copia esto en Streamlit Cloud -> Manage app -> Settings -> Secrets.
# SIN esta sección la app muestra datos de demostración.

[datos]
conector = "sql"      # "demo" o "sql"
url = "postgresql+psycopg2://usuario:clave@servidor:5432/produccion"
dias_produccion = 15  # días que toma producir un pedido; sirve para marcar "En riesgo"

[datos.consultas]
pedidos = "SELECT codigo, cliente, etapa, fecha_pedido, fecha_entrega, avance_produccion, no_conformes, cantidad_despachada, liberado, encuesta, fecha_entregado FROM v_pedidos"
lineas  = "SELECT codigo_pedido, producto, cantidad FROM v_pedido_lineas"
eventos = "SELECT codigo_pedido, fecha, etapa, clausula, descripcion, responsable, evidencia FROM v_pedido_eventos"

# --- WhatsApp Business (Meta Cloud API) ----------------------------------------
# Sin esta sección el botón "Enviar por WhatsApp" abre WhatsApp con el mensaje
# escrito (modo demo). Con ella, mensaje + PDF + Excel salen con un clic.
[whatsapp]
token = "EAAG..."              # token permanente de un usuario del sistema (Meta Business)
phone_number_id = "1234567890" # el id del número de la empresa, no el número
plantilla = "avance_pedido"    # plantilla aprobada, con cabecera DOCUMENTO y 6 variables
idioma = "es"
numero_pruebas = "987654321" # TU WhatsApp: el botón «Mi número (prueba)» envía aquí
solo_pruebas = true          # mientras se prueba: bloquea el envío a clientes
# Para probar sin plantilla aprobada: plantilla = ""  (texto libre + PDF + Excel).
# Funciona si escribiste "hola" al número de la empresa en las últimas 24 h.
