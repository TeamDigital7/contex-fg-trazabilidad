# =============================================================================
#  Contex FYG · Configuración LOCAL (servidor Windows de Contex)
#  Copiar como .streamlit/secrets.toml (instalar.bat lo hace solo) y completar.
#  Este archivo NUNCA se sube a GitHub (está en .gitignore).
#  Mientras la sección [datos] esté comentada, la app usa datos de demostración.
# =============================================================================

# [datos]
# conector = "sql"
#
# --- Conexión al SQL Server del ERP (HDSOFT) --------------------------------
# Usuario de solo lectura creado con sql/02_usuario_solo_lectura.sql.
# SERVIDOR: nombre o IP del servidor (con instancia: SERVIDOR\\SQLEXPRESS)
# BASE: nombre de la base del ERP
# Driver: el que tenga instalado el servidor ("ODBC Driver 17 for SQL Server" o
#         "ODBC Driver 18 for SQL Server"); probar_conexion.bat los lista.
# Si la contraseña tiene @ : / # % ? &, escribirla codificada (@ = %40, # = %23...).
#
# url = "mssql+pyodbc://app_trazabilidad:CLAVE@SERVIDOR:1433/BASE?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes"
#
# dias_produccion = 15   # días que suele tomar producir un pedido (para marcar «En riesgo»)
#
# [datos.consultas]
# Las 7 vistas del esquema app (se escriben con el resultado de sql/01_explorar_esquema.sql)
# pedidos = "SELECT * FROM app.v_pedidos"
# lineas  = "SELECT * FROM app.v_pedido_lineas"
# eventos = "SELECT * FROM app.v_pedido_eventos"
# costos_materiales = "SELECT * FROM app.v_liquidacion_mp"
# costos_mano_obra  = "SELECT * FROM app.v_liquidacion_mo"
# costos_terceros   = "SELECT * FROM app.v_ordenes_servicio"
# costos_cif        = "SELECT * FROM app.v_cif_mensual"

